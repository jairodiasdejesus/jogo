<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MEGA MANIA 8-bit — Shmup Espacial</title>
<meta name="description" content="Shmup tela fixa estilo Megamania Atari: nave lateral, 5 ondas, barra de energia.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div id="cab">
    <div id="scoreBox">SCORE <span id="score">0</span></div>
    <div id="hiBox">HI <span id="hi">0</span></div>
    <div id="levelBox">FASE <span id="level">1</span></div>
  </div>

  <div id="canvasHolder">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">MEGA★MANIA</h1>
      <p id="ovSub">HAMBURGUERES DO ESPAÇO</p>
      <p id="ovText">← → mover | ESPAÇO atirar<br>Toque e arraste no mobile</p>
      <button id="btnStart">▶ INICIAR</button>
      <p id="ovHint">Destrua a onda completa para recarregar energia.<br>Energia zerada = perde 1 vida.</p>
    </div>
  </div>

  <div id="hudBottom">
    <div id="livesBox">VIDAS <span id="lives">3</span></div>
    <div id="energyWrap">
      <div id="energyLabel">ENERGIA</div>
      <div id="energyBar"><div id="energyFill"></div></div>
    </div>
    <div id="waveBox">INIMIGO <span id="waveName">🍔</span></div>
  </div>

  <div id="touchControls">
    <button id="btnLeft" aria-label="Esquerda">◀</button>
    <button id="btnFire" aria-label="Atirar">FIRE</button>
    <button id="btnRight" aria-label="Direita">▶</button>
  </div>
</div>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/collision.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/main.js"></script>
</body>
</html>
